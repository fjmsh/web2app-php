name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  GRADLE_CI_JVMARGS: -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  php-runtime:
    name: PHP upload tests on the shipped Android PHP binary
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Free disk and add swap space
        run: |
          nproc
          free -h
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo fallocate -l 6G /swapfile.ci
          sudo chmod 600 /swapfile.ci
          sudo mkswap /swapfile.ci
          sudo swapon /swapfile.ci
          free -h
          df -h /

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Fetch the pinned PHP binary that generated APKs embed
        run: |
          deps=app/src/main/java/com/webtoapp/core/wordpress/WordPressDependencyManager.kt
          version=$(grep -oP 'const val PHP_VERSION = "\K[^"]+' "$deps")
          sha=$(grep -A1 'PHP_TARBALL_SHA256 =' "$deps" | grep -oP '"\K[0-9a-f]{64}')
          url="https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-${version}-latest/PHP-${version}-Android-arm64-PM5.tar.gz"
          mkdir -p "$RUNNER_TEMP/android-php"
          curl -fsSL -o "$RUNNER_TEMP/android-php/php.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/android-php/php.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/android-php/php.tar.gz" -C "$RUNNER_TEMP/android-php"
          qemu=$(command -v qemu-aarch64-static || command -v qemu-aarch64)
          wrapper="$RUNNER_TEMP/android-php/php"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$qemu" "$RUNNER_TEMP/android-php/bin/php7/bin/php" > "$wrapper"
          chmod +x "$wrapper"
          "$wrapper" -n -v
          "$wrapper" -n -r 'echo PHP_VERSION, " request_parse_body=", var_export(function_exists("request_parse_body"), true), PHP_EOL;'
          echo "PHP_BINARY=$wrapper" >> "$GITHUB_ENV"

      - name: Run PHP runtime tests against the Android binary
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="$GRADLE_CI_JVMARGS" \
            --max-workers=2 \
            -PskipShellTemplateSync=true \
            -PallowDebugSignedRelease=true \
            :app:testStandardDebugUnitTest \
            --tests 'com.webtoapp.core.php.*' \
            --tests 'com.webtoapp.core.wordpress.WordPressPhpRuntimeTest'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-runtime-test-report-${{ github.run_number }}
          path: app/build/reports/tests/testStandardDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build ${{ inputs.build_type }} APK
    needs: php-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BUILD_TYPE: ${{ inputs.build_type }}

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Free disk and add swap space
        run: |
          nproc
          free -h
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo fallocate -l 6G /swapfile.ci
          sudo chmod 600 /swapfile.ci
          sudo mkswap /swapfile.ci
          sudo swapon /swapfile.ci
          free -h
          df -h /

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Build shell template and host APK
        run: |
          variant="Standard${BUILD_TYPE^}"
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="$GRADLE_CI_JVMARGS" \
            --max-workers=2 \
            -PallowDebugSignedRelease=true \
            ":app:assemble${variant}"

      - name: Verify the fixed PHP router ships in the template and host APK
        run: |
          template=app/src/main/assets/template/webview_shell.apk
          host=$(ls app/build/outputs/apk/standard/"$BUILD_TYPE"/*.apk | head -n1)
          for apk in "$template" "$host"; do
            unzip -p "$apk" assets/php_router_server.php > router.php
            grep -q "PHP_SAPI !== 'cli-server'" router.php
            if grep -q "function parseMultipart" router.php; then
              echo "::error::$apk still ships the legacy userland multipart parser"
              exit 1
            fi
            echo "$apk ships the cli-server router ($(sha256sum router.php | cut -d' ' -f1))"
          done
          unzip -p "$template" assets/php_router_server.php | cmp - app/src/main/assets/php_router_server.php

      - name: Name APK
        run: |
          mkdir -p dist
          src=$(ls app/build/outputs/apk/standard/"$BUILD_TYPE"/*.apk | head -n1)
          name="${{ github.event.repository.name }}-${{ github.run_number }}-standard-${BUILD_TYPE}"
          if [ "$BUILD_TYPE" = release ]; then name="${name}-DEBUG-SIGNED-do-not-distribute"; fi
          cp "$src" "dist/${name}.apk"
          echo "APK_NAME=${name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}.apk
          if-no-files-found: error
          retention-days: 30
